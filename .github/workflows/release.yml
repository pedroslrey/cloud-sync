name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Verify tag version
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
      - name: Test
        run: cargo test --locked
      - name: Build release binary
        run: cargo build --release --locked
      - name: Prepare assets
        run: |
          cp target/release/cloud-sync cloud-sync-linux-x86_64
          sha256sum cloud-sync-linux-x86_64 > cloud-sync-linux-x86_64.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            cloud-sync-linux-x86_64 \
            cloud-sync-linux-x86_64.sha256 \
            --generate-notes \
            --verify-tag
