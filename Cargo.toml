[package]
name = "cloud-sync"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.48", features = ["derive"] }
clap_complete = "4.5.58"
directories = "6.0.0"
fs2 = "0.4.3"
globset = "0.4.16"
notify = "8.2.0"
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.8"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
walkdir = "2.5.0"
