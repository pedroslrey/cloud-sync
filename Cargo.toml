[package]
name = "cloud-sync"
version = "0.3.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.48", features = ["derive"] }
clap_complete = "4.5.58"
directories = "6.0.0"
fs2 = "0.4.3"
globset = "0.4.16"
notify = "8.2.0"
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
toml = "0.9.8"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
walkdir = "2.5.0"
